<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR 识别工具</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --panel: rgba(255, 252, 245, 0.9);
      --line: #d7c8af;
      --text: #2d261d;
      --accent: #1f6f5f;
      --accent-2: #bf5b04;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(31,111,95,0.16), transparent 32%),
        linear-gradient(135deg, #f7f4ee, var(--bg));
    }
    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 20px;
    }
    .hero h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }
    .hero p {
      margin: 8px 0 0;
      color: #5f5649;
    }
    .status-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(77, 57, 27, 0.08);
      backdrop-filter: blur(10px);
    }
    .video-panel {
      display: grid;
      gap: 14px;
      padding: 16px;
    }
    .video-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid #c8b79a;
      background: #161616;
      aspect-ratio: 4 / 3;
    }
    .video-wrap.roi-mode {
      cursor: crosshair;
    }
    .video-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .roi-box {
      position: absolute;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      pointer-events: none;
      display: none;
    }
    .roi-box.cpu {
      border: 2px solid #00b4ff;
      background: rgba(0, 180, 255, 0.18);
    }
    .roi-box.qr {
      border: 2px solid #ff8c42;
      background: rgba(255, 140, 66, 0.18);
    }
    .roi-box.active {
      box-shadow: 0 0 0 2px rgba(255,255,255,0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }
    .overlay-box {
      position: absolute;
      display: none;
      pointer-events: none;
      border-radius: 14px;
      border: 2px solid;
      background: transparent;
    }
    .overlay-box.qr-detected {
      border-color: #ffd447;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.18) inset, 0 0 0 1px rgba(255,255,255,0.2);
    }
    .overlay-box.cpu-detected {
      border-color: #53d57a;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.18) inset, 0 0 0 1px rgba(255,255,255,0.2);
    }
    .overlay-tag {
      position: absolute;
      display: none;
      max-width: 52%;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.24);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      color: #fff;
      background: transparent;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: none;
    }
    .overlay-tag.cpu-tag {
      border-color: rgba(83, 213, 122, 0.45);
    }
    .overlay-tag.qr-tag {
      border-color: rgba(255, 212, 71, 0.45);
    }
    .overlay-tag.light-text {
      color: #fdfdfd;
      text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.85);
    }
    .overlay-tag.dark-text {
      color: #121212;
      text-shadow: 0 1px 2px rgba(255,255,255,0.92), 0 0 8px rgba(255,255,255,0.82);
    }
    .box-label {
      display: none;
    }
    .roi-panel {
      display: grid;
      gap: 10px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .section-head label {
      margin: 0;
    }
    .small-btn {
      padding: 9px 14px;
      border-radius: 12px;
    }
    .controls {
      display: grid;
      gap: 14px;
      padding: 20px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .field-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px 14px;
      align-items: center;
    }
    label {
      font-size: 14px;
      font-weight: 700;
    }
    input, select, button, textarea {
      font: inherit;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid #ccb99c;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
    }
    input:disabled {
      background: #ebe3d6;
      color: #9a8e7d;
      cursor: not-allowed;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    button.alt {
      background: #efe4d3;
      color: #433729;
      border: 1px solid #ccb99c;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .checkline {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkline input {
      width: auto;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .metric {
      padding: 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .metric .name {
      display: block;
      font-size: 13px;
      color: #776b5e;
      margin-bottom: 6px;
    }
    .metric .value {
      font-size: 22px;
      font-weight: 800;
    }
    .result-box, .log-box {
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 14px;
      min-height: 120px;
      white-space: pre-wrap;
    }
    .result-box {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.35;
      transition: color 160ms ease, transform 160ms ease;
    }
    .result-box.pass {
      color: #138a36;
    }
    .result-box.fail {
      color: #c43828;
    }
    .result-box.pending {
      color: #8a7154;
    }
    .log-box {
      height: 260px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
    }
    .footnote {
      color: #6f6456;
      font-size: 13px;
    }
    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .metrics {
        grid-template-columns: 1fr;
      }
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <h1><span id="ocr-title-trigger">OCR</span> 识别工具</h1>
        <p>网页模式，复用 RKNN OCR 流程，展示设备、日志、结果和耗时。</p>
      </div>
      <input id="local-image-input" type="file" accept="image/*" hidden>
      <div class="status-pill" id="status-pill">服务初始化中</div>
    </div>
    <div class="grid">
      <section class="panel video-panel">
        <div class="video-wrap" id="video-wrap">
          <img id="video-feed" src="/video_feed" alt="视频预览" draggable="false">
          <div class="overlay-layer" id="overlay-layer">
            <div class="roi-box cpu" id="cpu-roi-box"><span class="box-label" id="cpu-roi-label"></span></div>
            <div class="roi-box qr" id="qr-roi-box"><span class="box-label" id="qr-roi-label"></span></div>
            <div class="overlay-box cpu-detected" id="cpu-detected-box"><span class="box-label">CPU DETECT</span></div>
            <div class="overlay-box qr-detected" id="qr-detected-box"><span class="box-label">QR DETECT</span></div>
            <div class="overlay-tag cpu-tag" id="cpu-result-tag"></div>
            <div class="overlay-tag qr-tag" id="qr-result-tag"></div>
          </div>
        </div>
        <div class="roi-panel">
          <div class="row">
            <select id="roi-target-select">
              <option value="cpu">CPU ROI</option>
              <option value="qr">二维码 ROI</option>
            </select>
            <label class="checkline">
              <input type="checkbox" id="roi-enabled">
              启用当前 ROI
            </label>
          </div>
          <div class="footnote">当前选中哪一类 ROI，就编辑哪一类；CPU 识别使用 CPU ROI，二维码识别使用二维码 ROI。</div>
        </div>
        <div>
          <div class="section-head">
            <label>日志输出</label>
            <button class="alt small-btn" id="clear-log-btn">清空日志</button>
          </div>
          <div class="log-box" id="log-box"></div>
        </div>
      </section>
      <section class="panel controls">
        <div class="row">
          <select id="device-select"></select>
          <button class="alt" id="refresh-btn">刷新设备</button>
        </div>

        <div class="field-grid">
          <label for="work-order-input">工单号</label>
          <input id="work-order-input" placeholder="请输入工单号">

          <label for="sn-input">输入 SN 号</label>
          <input id="sn-input" placeholder="请输入 SN" disabled>

          <label for="vendor-input">前三码</label>
          <input id="vendor-input" placeholder="前三码" disabled>

          <label for="model-input">后四码</label>
          <input id="model-input" placeholder="后四码" disabled>
        </div>

        <label class="checkline">
          <input type="checkbox" id="manual-sn-enabled">
          手动输入 SN
        </label>

        <label class="checkline">
          <input type="checkbox" id="vendor-enabled">
          编辑前三码 / 后四码
        </label>

        <label class="checkline">
          <input type="checkbox" id="force-upload">
          强制上传
        </label>

        <label class="checkline">
          <input type="checkbox" id="loop-detect">
          循环检测
        </label>

        <div class="metrics">
          <div class="metric">
            <span class="name">登录耗时</span>
            <span class="value" id="download-cost">-</span>
          </div>
          <div class="metric">
            <span class="name">识别耗时</span>
            <span class="value" id="detect-cost">-</span>
          </div>
          <div class="metric">
            <span class="name">上传耗时</span>
            <span class="value" id="upload-cost">-</span>
          </div>
        </div>

        <div>
          <label>识别结果</label>
          <div class="result-box" id="result-box">等待检测</div>
        </div>

        <div class="row">
          <button id="detect-btn">开始检测</button>
        </div>
        <div class="footnote">未勾选手动 SN 时，开始检测会先识别二维码并回填 SN，再做 CPU OCR 和上传。循环检测下，同一 SN 上次 PASS 会显示 PASS 等待下一台；同一 SN 上次 FAIL 会继续重试，直到 PASS 或换机。</div>
      </section>
    </div>
  </div>

  <script>
    const statusPill = document.getElementById("status-pill");
    const ocrTitleTrigger = document.getElementById("ocr-title-trigger");
    const localImageInput = document.getElementById("local-image-input");
    const deviceSelect = document.getElementById("device-select");
    const refreshBtn = document.getElementById("refresh-btn");
    const detectBtn = document.getElementById("detect-btn");
    const clearLogBtn = document.getElementById("clear-log-btn");
    const manualSnEnabled = document.getElementById("manual-sn-enabled");
    const snInput = document.getElementById("sn-input");
    const vendorEnabled = document.getElementById("vendor-enabled");
    const vendorInput = document.getElementById("vendor-input");
    const modelInput = document.getElementById("model-input");
    const resultBox = document.getElementById("result-box");
    const logBox = document.getElementById("log-box");
    const videoWrap = document.getElementById("video-wrap");
    const videoFeed = document.getElementById("video-feed");
    const overlayLayer = document.getElementById("overlay-layer");
    const cpuRoiBox = document.getElementById("cpu-roi-box");
    const qrRoiBox = document.getElementById("qr-roi-box");
    const cpuRoiLabel = document.getElementById("cpu-roi-label");
    const qrRoiLabel = document.getElementById("qr-roi-label");
    const cpuDetectedBox = document.getElementById("cpu-detected-box");
    const qrDetectedBox = document.getElementById("qr-detected-box");
    const cpuResultTag = document.getElementById("cpu-result-tag");
    const qrResultTag = document.getElementById("qr-result-tag");
    const forceUpload = document.getElementById("force-upload");
    const loopDetect = document.getElementById("loop-detect");
    const roiEnabled = document.getElementById("roi-enabled");
    const roiTargetSelect = document.getElementById("roi-target-select");
    const ROI_SOURCE_WIDTH = 640;
    const ROI_SOURCE_HEIGHT = 480;
    let roiDirty = false;
    let selectedRoiTarget = "cpu";
    let currentState = {operation_mode: "server", local_image_name: null, overlays: {cpu: null, qr: null}};
    let currentRois = {
      cpu: {enabled: false, x: 180, y: 150, w: 300, h: 150},
      qr: {enabled: false, x: 180, y: 150, w: 300, h: 150}
    };
    let isDrawingRoi = false;
    let roiStartPoint = null;
    let loopTimer = null;
    const LOOP_RETRY_DELAY_MS = 1200;
    const LOOP_WAIT_DELAY_MS = 1000;
    const overlaySampleCanvas = document.createElement("canvas");
    const overlaySampleContext = overlaySampleCanvas.getContext("2d", {willReadFrequently: true});

    function costText(value) {
      return value == null ? "-" : `${value.toFixed(3)}s`;
    }

    function updateDeviceOptions(devices, selectedDevice) {
      const previous = deviceSelect.value;
      deviceSelect.innerHTML = "";
      if (!devices.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "无可用设备";
        deviceSelect.appendChild(option);
        deviceSelect.disabled = true;
        return;
      }

      deviceSelect.disabled = false;
      devices.forEach((device) => {
        const option = document.createElement("option");
        option.value = device;
        option.textContent = device;
        deviceSelect.appendChild(option);
      });
      deviceSelect.value = selectedDevice || previous || devices[0];
    }

    function syncVendorEditState() {
      const editable = vendorEnabled.checked;
      vendorInput.disabled = !editable;
      modelInput.disabled = !editable;
    }

    function sanitizeFixedLengthInput(value, maxLength) {
      return (value || "")
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .slice(0, maxLength);
    }

    function maybeLockVendorInputs() {
      const vendorValue = sanitizeFixedLengthInput(vendorInput.value, 3);
      const modelValue = sanitizeFixedLengthInput(modelInput.value, 4);
      if (vendorInput.value !== vendorValue) {
        vendorInput.value = vendorValue;
      }
      if (modelInput.value !== modelValue) {
        modelInput.value = modelValue;
      }
      const vendorComplete = vendorValue.length === 3;
      const modelComplete = modelValue.length === 4;
      if (vendorComplete && modelComplete) {
        vendorEnabled.checked = false;
      }
      syncVendorEditState();
    }

    function syncSnEditState() {
      snInput.disabled = !manualSnEnabled.checked;
    }

    function getCurrentRoi() {
      return currentRois[selectedRoiTarget] || currentRois.cpu;
    }

    function getRoiBox(target) {
      return target === "qr" ? qrRoiBox : cpuRoiBox;
    }

    function getRoiLabel(target) {
      return target === "qr" ? qrRoiLabel : cpuRoiLabel;
    }

    function syncRoiEditState() {
      const currentRoi = getCurrentRoi();
      roiEnabled.checked = Boolean(currentRoi.enabled);
      videoWrap.classList.toggle("roi-mode", roiEnabled.checked);
      ["cpu", "qr"].forEach((target) => {
        getRoiBox(target).classList.toggle("active", target === selectedRoiTarget);
      });
    }

    function applyRoiState(rois) {
      if (!rois) {
        return;
      }
      if (roiDirty) {
        return;
      }
      ["cpu", "qr"].forEach((target) => {
        const roi = rois[target] || currentRois[target];
        currentRois[target] = {
          enabled: Boolean(roi.enabled),
          x: Number(roi.x),
          y: Number(roi.y),
          w: Number(roi.w),
          h: Number(roi.h)
        };
      });
      syncRoiEditState();
      renderRoiOverlay();
    }

    function renderRoiOverlay() {
      const width = videoWrap.clientWidth;
      const height = videoWrap.clientHeight;
      if (!width || !height) {
        return;
      }
      ["cpu", "qr"].forEach((target) => {
        const roi = currentRois[target];
        const roiBox = getRoiBox(target);
        if (!roi.enabled) {
          roiBox.style.display = "none";
          return;
        }
        roiBox.style.display = "block";
        roiBox.style.left = `${(roi.x / ROI_SOURCE_WIDTH) * width}px`;
        roiBox.style.top = `${(roi.y / ROI_SOURCE_HEIGHT) * height}px`;
        roiBox.style.width = `${(roi.w / ROI_SOURCE_WIDTH) * width}px`;
        roiBox.style.height = `${(roi.h / ROI_SOURCE_HEIGHT) * height}px`;
      });
      renderDetectionOverlay();
    }

    function getPointInVideo(event) {
      const rect = videoWrap.getBoundingClientRect();
      const x = Math.min(Math.max(event.clientX - rect.left, 0), rect.width);
      const y = Math.min(Math.max(event.clientY - rect.top, 0), rect.height);
      return {x, y, width: rect.width, height: rect.height};
    }

    function drawTempRoi(start, end) {
      const left = Math.min(start.x, end.x);
      const top = Math.min(start.y, end.y);
      const width = Math.abs(end.x - start.x);
      const height = Math.abs(end.y - start.y);
      const roiBox = getRoiBox(selectedRoiTarget);
      roiBox.style.display = "block";
      roiBox.style.left = `${left}px`;
      roiBox.style.top = `${top}px`;
      roiBox.style.width = `${width}px`;
      roiBox.style.height = `${height}px`;
    }

    async function saveRoiState(roi) {
      const response = await fetch("/api/roi", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({...roi, target: selectedRoiTarget})
      });
      const data = await response.json();
      if (response.ok) {
        roiDirty = false;
        applyRoiState(data.rois);
      }
      await fetchStatus();
    }

    async function finishRoiDraw(endPoint) {
      if (!roiStartPoint) {
        return;
      }
      const left = Math.min(roiStartPoint.x, endPoint.x);
      const top = Math.min(roiStartPoint.y, endPoint.y);
      const width = Math.abs(endPoint.x - roiStartPoint.x);
      const height = Math.abs(endPoint.y - roiStartPoint.y);
      roiStartPoint = null;
      isDrawingRoi = false;

      if (width < 8 || height < 8) {
        renderRoiOverlay();
        return;
      }

      await saveRoiState({
        enabled: true,
        x: Math.round((left / endPoint.width) * ROI_SOURCE_WIDTH),
        y: Math.round((top / endPoint.height) * ROI_SOURCE_HEIGHT),
        w: Math.round((width / endPoint.width) * ROI_SOURCE_WIDTH),
        h: Math.round((height / endPoint.height) * ROI_SOURCE_HEIGHT)
      });
    }

    function applyResultState(text) {
      const normalized = (text || "").trim().toUpperCase();
      resultBox.classList.remove("pass", "fail", "pending");
      if (normalized.startsWith("PASS")) {
        resultBox.classList.add("pass");
      } else if (normalized.startsWith("FAIL")) {
        resultBox.classList.add("fail");
      } else {
        resultBox.classList.add("pending");
      }
    }

    function scaleRect(rect, width, height) {
      return {
        left: (rect.x / ROI_SOURCE_WIDTH) * width,
        top: (rect.y / ROI_SOURCE_HEIGHT) * height,
        width: (rect.w / ROI_SOURCE_WIDTH) * width,
        height: (rect.h / ROI_SOURCE_HEIGHT) * height
      };
    }

    function intersects(a, b) {
      return !(a.left + a.width < b.left || b.left + b.width < a.left || a.top + a.height < b.top || b.top + b.height < a.top);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function sampleFrameBrightness(rect) {
      if (!overlaySampleContext || !videoFeed.complete || !videoFeed.naturalWidth || !videoFeed.naturalHeight) {
        return null;
      }
      const wrapWidth = videoWrap.clientWidth;
      const wrapHeight = videoWrap.clientHeight;
      if (!wrapWidth || !wrapHeight) {
        return null;
      }
      const sampleSize = 24;
      const sourceX = Math.round(clamp(((rect.left + rect.width / 2) / wrapWidth) * videoFeed.naturalWidth, 0, videoFeed.naturalWidth - 1));
      const sourceY = Math.round(clamp(((rect.top + rect.height / 2) / wrapHeight) * videoFeed.naturalHeight, 0, videoFeed.naturalHeight - 1));
      const sampleHalf = Math.floor(sampleSize / 2);
      const sx = clamp(sourceX - sampleHalf, 0, Math.max(0, videoFeed.naturalWidth - sampleSize));
      const sy = clamp(sourceY - sampleHalf, 0, Math.max(0, videoFeed.naturalHeight - sampleSize));
      overlaySampleCanvas.width = sampleSize;
      overlaySampleCanvas.height = sampleSize;
      try {
        overlaySampleContext.clearRect(0, 0, sampleSize, sampleSize);
        overlaySampleContext.drawImage(videoFeed, sx, sy, sampleSize, sampleSize, 0, 0, sampleSize, sampleSize);
        const imageData = overlaySampleContext.getImageData(0, 0, sampleSize, sampleSize).data;
        let total = 0;
        const pixelCount = imageData.length / 4;
        for (let index = 0; index < imageData.length; index += 4) {
          total += 0.299 * imageData[index] + 0.587 * imageData[index + 1] + 0.114 * imageData[index + 2];
        }
        return total / pixelCount;
      } catch (error) {
        return null;
      }
    }

    function applyTagContrast(tagEl, rect) {
      const brightness = sampleFrameBrightness(rect);
      const useDarkText = brightness != null && brightness >= 150;
      tagEl.classList.toggle("dark-text", useDarkText);
      tagEl.classList.toggle("light-text", !useDarkText);
    }

    function resetOverlayTag(tagEl) {
      tagEl.style.display = "none";
      tagEl.textContent = "";
      tagEl.style.left = "";
      tagEl.style.top = "";
      tagEl.style.width = "";
      tagEl.classList.remove("dark-text", "light-text");
    }

    function resetOverlayBox(boxEl) {
      boxEl.style.display = "none";
      boxEl.style.left = "";
      boxEl.style.top = "";
      boxEl.style.width = "";
      boxEl.style.height = "";
    }

    function placeTag(tagEl, text, anchorRect, blockedRects) {
      if (!text || !anchorRect) {
        resetOverlayTag(tagEl);
        return;
      }
      tagEl.textContent = text;
      tagEl.style.display = "block";
      const margin = 8;
      const tagWidth = Math.min(videoWrap.clientWidth * 0.52, 320);
      const preferredLeft = Math.min(Math.max(anchorRect.left, margin), Math.max(margin, videoWrap.clientWidth - tagWidth - margin));
      const tagHeight = tagEl.offsetHeight || 44;
      const candidates = [
        {left: preferredLeft, top: Math.max(margin, anchorRect.top - tagHeight - margin), width: tagWidth, height: tagHeight},
        {left: preferredLeft, top: Math.min(videoWrap.clientHeight - tagHeight - margin, anchorRect.top + anchorRect.height + margin), width: tagWidth, height: tagHeight},
        {left: Math.max(margin, anchorRect.left - tagWidth - margin), top: anchorRect.top, width: tagWidth, height: tagHeight},
        {left: Math.min(videoWrap.clientWidth - tagWidth - margin, anchorRect.left + anchorRect.width + margin), top: anchorRect.top, width: tagWidth, height: tagHeight}
      ];
      let selected = candidates[0];
      for (const candidate of candidates) {
        if (!blockedRects.some((blocked) => intersects(candidate, blocked))) {
          selected = candidate;
          break;
        }
      }
      tagEl.style.left = `${selected.left}px`;
      tagEl.style.top = `${selected.top}px`;
      tagEl.style.width = `${selected.width}px`;
      applyTagContrast(tagEl, selected);
      blockedRects.push(selected);
    }

    function renderOverlayBox(boxEl, overlay, width, height) {
      if (!overlay || !overlay.rect) {
        resetOverlayBox(boxEl);
        return null;
      }
      const rect = scaleRect(overlay.rect, width, height);
      boxEl.style.display = "block";
      boxEl.style.left = `${rect.left}px`;
      boxEl.style.top = `${rect.top}px`;
      boxEl.style.width = `${rect.width}px`;
      boxEl.style.height = `${rect.height}px`;
      return rect;
    }

    function renderDetectionOverlay() {
      const width = videoWrap.clientWidth;
      const height = videoWrap.clientHeight;
      if (!width || !height) {
        return;
      }
      resetOverlayBox(cpuDetectedBox);
      resetOverlayBox(qrDetectedBox);
      resetOverlayTag(cpuResultTag);
      resetOverlayTag(qrResultTag);
      const blockedRects = [];
      const cpuOverlay = currentState.overlays?.cpu;
      const qrOverlay = currentState.overlays?.qr;
      const roiRects = [];
      const roiRectMap = {};
      const defaultQrRect = {left: 12, top: 12, width: Math.min(width * 0.42, 260), height: 44};
      const defaultCpuRect = {left: Math.max(12, width - Math.min(width * 0.42, 260) - 12), top: 12, width: Math.min(width * 0.42, 260), height: 44};
      ["cpu", "qr"].forEach((target) => {
        const roi = currentRois[target];
        if (roi.enabled) {
          const rect = scaleRect(roi, width, height);
          roiRects.push(rect);
          roiRectMap[target] = rect;
        }
      });
      const qrRect = renderOverlayBox(qrDetectedBox, qrOverlay, width, height);
      const cpuRect = renderOverlayBox(cpuDetectedBox, cpuOverlay, width, height);
      roiRects.forEach((rect) => blockedRects.push(rect));
      if (qrRect) {
        blockedRects.push(qrRect);
      }
      if (cpuRect) {
        blockedRects.push(cpuRect);
      }
      const resultText = String(currentState.result_text || "");
      const hasDetectionOutcome = currentState.last_result_status && currentState.last_result_status !== "idle";
      const qrText = qrOverlay?.text || (hasDetectionOutcome ? "null" : "");
      const cpuText = cpuOverlay?.text || (hasDetectionOutcome ? "null" : "");
      placeTag(qrResultTag, qrText, qrRect || roiRectMap.qr || defaultQrRect, blockedRects);
      placeTag(cpuResultTag, cpuText, cpuRect || roiRectMap.cpu || defaultCpuRect, blockedRects);
    }

    function renderState(data) {
      const overlays = Object.prototype.hasOwnProperty.call(data || {}, "overlays")
        ? (data.overlays || {cpu: null, qr: null})
        : {cpu: null, qr: null};
      currentState = {
        ...currentState,
        ...data,
        overlays
      };
      const shouldStickToBottom =
        logBox.scrollHeight - logBox.clientHeight - logBox.scrollTop < 24;
      if (data.detecting) {
        statusPill.textContent = "检测进行中";
      } else if (data.operation_mode === "local") {
        statusPill.textContent = `本地图片模式${data.local_image_name ? `: ${data.local_image_name}` : ""}`;
      } else {
        statusPill.textContent = "服务运行中";
      }
      detectBtn.disabled = data.detecting;
      refreshBtn.disabled = data.detecting;
      resultBox.textContent = data.result_text || "等待检测";
      applyResultState(resultBox.textContent);
      document.getElementById("download-cost").textContent = costText(data.time_info.download);
      document.getElementById("detect-cost").textContent = costText(data.time_info.detect);
      document.getElementById("upload-cost").textContent = costText(data.time_info.upload);
      updateDeviceOptions(data.devices, data.selected_device);
      syncSnEditState();
      syncVendorEditState();
      applyRoiState(data.rois);
      renderDetectionOverlay();
      logBox.textContent = data.logs.join("\n");
      if (shouldStickToBottom) {
        logBox.scrollTop = logBox.scrollHeight;
      }
    }

    async function fetchStatus() {
      const response = await fetch("/api/status");
      const data = await response.json();
      renderState(data);
    }

    async function refreshDevices() {
      const response = await fetch("/api/devices");
      const data = await response.json();
      updateDeviceOptions(data.devices, data.selected_device);
      await fetchStatus();
    }

    async function changeDevice() {
      await fetch("/api/select-device", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({device: deviceSelect.value})
      });
      await fetchStatus();
    }

    function clearLoopTimer() {
      if (loopTimer) {
        clearTimeout(loopTimer);
        loopTimer = null;
      }
    }

    function scheduleLoopDetect(delay = LOOP_RETRY_DELAY_MS) {
      clearLoopTimer();
      if (!loopDetect.checked) {
        return;
      }
      loopTimer = setTimeout(() => {
        detect(true);
      }, delay);
    }

    function validateDetectInputs() {
      const workOrderNumber = document.getElementById("work-order-input").value.trim();
      const sn = snInput.value.trim();
      const vendor = sanitizeFixedLengthInput(vendorInput.value, 3);
      const model = sanitizeFixedLengthInput(modelInput.value, 4);
      const missing = [];
      if (!workOrderNumber) {
        missing.push("工单号");
      }
      if (manualSnEnabled.checked && !sn) {
        missing.push("SN");
      }
      if (vendor.length !== 3) {
        missing.push("前三码");
      }
      if (model.length !== 4) {
        missing.push("后四码");
      }
      if (!missing.length) {
        return null;
      }
      return `${missing.join("、")}不能为空。`;
    }

    async function detect(fromLoop = false) {
      const validationError = validateDetectInputs();
      if (validationError) {
        resultBox.textContent = `FAIL\n${validationError}`;
        statusPill.textContent = validationError;
        applyResultState(resultBox.textContent);
        clearLoopTimer();
        return;
      }
      clearLoopTimer();
      detectBtn.disabled = true;
      statusPill.textContent = loopDetect.checked ? "循环检测中" : "检测进行中";
      try {
        const response = await fetch("/api/detect", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            work_order_number: document.getElementById("work-order-input").value,
            sn: snInput.value,
            manual_sn_enabled: manualSnEnabled.checked,
            vendor: vendorInput.value,
            model: modelInput.value,
            force_upload: forceUpload.checked
          })
        });
        const data = await response.json();
        if (!response.ok && response.status !== 409) {
          resultBox.textContent = "FAIL";
        }
        const resolvedSn = data.sn || data.state?.last_seen_sn;
        if (resolvedSn && !manualSnEnabled.checked) {
          snInput.value = resolvedSn;
        }
        renderState(data.state || data);
        if (!response.ok && data.error) {
          statusPill.textContent = data.error;
        }
        if (loopDetect.checked) {
          const isBusyConflict = response.status === 409 && (data.error || "").includes("检测进行中");
          const isPassWait = response.status === 409 && data.state?.last_result_status === "pass";
          const shouldContinue =
            response.ok ||
            response.status === 500 ||
            isBusyConflict ||
            isPassWait;
          if (shouldContinue) {
            scheduleLoopDetect(isPassWait ? LOOP_WAIT_DELAY_MS : LOOP_RETRY_DELAY_MS);
          }
        }
      } catch (error) {
        resultBox.textContent = "FAIL";
        statusPill.textContent = "检测请求失败";
        if (loopDetect.checked) {
          scheduleLoopDetect();
        }
      } finally {
        detectBtn.disabled = false;
      }
    }

    async function clearLocalImageMode() {
      statusPill.textContent = "切回摄像头中";
      const response = await fetch("/api/local-mode", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: "exit"})
      });
      const data = await response.json();
      renderState(data.state || data);
    }

    async function enterLocalImageMode() {
      statusPill.textContent = "进入本地图片模式";
      const response = await fetch("/api/local-mode", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: "enter"})
      });
      const data = await response.json();
      renderState(data.state || data);
    }

    async function uploadLocalImage(file) {
      const formData = new FormData();
      formData.append("image", file);
      statusPill.textContent = "上传本地图片中";
      const response = await fetch("/api/local-image", {
        method: "POST",
        body: formData
      });
      const data = await response.json();
      renderState(data.state || data);
    }

    async function clearLogs() {
      clearLogBtn.disabled = true;
      const response = await fetch("/api/logs/clear", {method: "POST"});
      const data = await response.json();
      renderState(data.state || data);
      clearLogBtn.disabled = false;
    }

    vendorEnabled.addEventListener("change", syncVendorEditState);
    vendorInput.addEventListener("input", maybeLockVendorInputs);
    modelInput.addEventListener("input", maybeLockVendorInputs);
    manualSnEnabled.addEventListener("change", syncSnEditState);
    roiTargetSelect.addEventListener("change", () => {
      selectedRoiTarget = roiTargetSelect.value;
      roiDirty = false;
      syncRoiEditState();
      renderRoiOverlay();
    });
    roiEnabled.addEventListener("change", async () => {
      roiDirty = true;
      const currentRoi = {...getCurrentRoi(), enabled: roiEnabled.checked};
      currentRois[selectedRoiTarget] = currentRoi;
      syncRoiEditState();
      renderRoiOverlay();
      await saveRoiState(currentRoi);
    });
    refreshBtn.addEventListener("click", refreshDevices);
    detectBtn.addEventListener("click", () => detect(false));
    loopDetect.addEventListener("change", () => {
      if (loopDetect.checked) {
        statusPill.textContent = "循环检测已开启";
        detect(true);
      } else {
        clearLoopTimer();
        statusPill.textContent = "循环检测已关闭";
      }
    });
    clearLogBtn.addEventListener("click", clearLogs);
    deviceSelect.addEventListener("change", changeDevice);
    videoWrap.addEventListener("mousedown", (event) => {
      if (!roiEnabled.checked) {
        return;
      }
      roiDirty = true;
      isDrawingRoi = true;
      roiStartPoint = getPointInVideo(event);
      drawTempRoi(roiStartPoint, roiStartPoint);
    });
    window.addEventListener("mousemove", (event) => {
      if (!isDrawingRoi || !roiStartPoint) {
        return;
      }
      drawTempRoi(roiStartPoint, getPointInVideo(event));
    });
    window.addEventListener("mouseup", async (event) => {
      if (!isDrawingRoi || !roiStartPoint) {
        return;
      }
      await finishRoiDraw(getPointInVideo(event));
    });
    window.addEventListener("resize", () => {
      renderRoiOverlay();
      renderDetectionOverlay();
    });
    videoFeed.addEventListener("load", renderDetectionOverlay);
    ocrTitleTrigger.addEventListener("dblclick", async () => {
      if (currentState.operation_mode === "server") {
        await enterLocalImageMode();
        return;
      }
      if (currentState.local_image_name) {
        await clearLocalImageMode();
        return;
      }
      localImageInput.click();
    });
    localImageInput.addEventListener("change", async () => {
      const file = localImageInput.files && localImageInput.files[0];
      if (!file) {
        return;
      }
      await uploadLocalImage(file);
      localImageInput.value = "";
    });

    selectedRoiTarget = roiTargetSelect.value;
    syncSnEditState();
    maybeLockVendorInputs();
    syncVendorEditState();
    syncRoiEditState();
    applyResultState(resultBox.textContent);
    refreshDevices();
    fetchStatus();
    setInterval(fetchStatus, 1500);
  </script>
</body>
</html>
