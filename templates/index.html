<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR 识别工具</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --panel: rgba(255, 252, 245, 0.9);
      --line: #d7c8af;
      --text: #2d261d;
      --accent: #1f6f5f;
      --accent-2: #bf5b04;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(31,111,95,0.16), transparent 32%),
        linear-gradient(135deg, #f7f4ee, var(--bg));
    }
    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 20px;
    }
    .hero h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }
    .hero p {
      margin: 8px 0 0;
      color: #5f5649;
    }
    .status-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(77, 57, 27, 0.08);
      backdrop-filter: blur(10px);
    }
    .video-panel {
      display: grid;
      gap: 14px;
      padding: 16px;
    }
    .video-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid #c8b79a;
      background: #161616;
      aspect-ratio: 4 / 3;
    }
    .video-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .overlay-box {
      position: absolute;
      display: none;
      pointer-events: none;
      border-radius: 14px;
      border: 2px solid;
      background: transparent;
    }
    .overlay-box.qr-detected {
      border-color: #ffd447;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.18) inset, 0 0 0 1px rgba(255,255,255,0.2);
    }
    .overlay-box.cpu-detected {
      border-color: #53d57a;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.18) inset, 0 0 0 1px rgba(255,255,255,0.2);
    }
    .box-label {
      display: none;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .section-head label {
      margin: 0;
    }
    .small-btn {
      padding: 9px 14px;
      border-radius: 12px;
    }
    .controls {
      display: grid;
      gap: 14px;
      padding: 20px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .field-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px 14px;
      align-items: center;
    }
    label {
      font-size: 14px;
      font-weight: 700;
    }
    input, select, button, textarea {
      font: inherit;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid #ccb99c;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
    }
    input:disabled {
      background: #ebe3d6;
      color: #9a8e7d;
      cursor: not-allowed;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    button.alt {
      background: #efe4d3;
      color: #433729;
      border: 1px solid #ccb99c;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .checkline {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkline input {
      width: auto;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .metric {
      padding: 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .metric .name {
      display: block;
      font-size: 13px;
      color: #776b5e;
      margin-bottom: 6px;
    }
    .metric .value {
      font-size: 22px;
      font-weight: 800;
    }
    .result-box, .log-box {
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 14px;
      min-height: 120px;
      white-space: pre-wrap;
    }
    .result-box {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.35;
      transition: color 160ms ease, transform 160ms ease;
    }
    .result-box.pass {
      color: #138a36;
    }
    .result-box.fail {
      color: #c43828;
    }
    .result-box.pending {
      color: #8a7154;
    }
    .log-box {
      height: 260px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
    }
    .footnote {
      color: #6f6456;
      font-size: 13px;
    }
    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .metrics {
        grid-template-columns: 1fr;
      }
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <h1><span id="ocr-title-trigger">OCR</span> 识别工具</h1>
        <p>网页模式，复用 RKNN OCR 流程，展示设备、日志、结果和耗时。</p>
      </div>
      <input id="local-image-input" type="file" accept="image/*" hidden>
      <div class="status-pill" id="status-pill">服务初始化中</div>
    </div>
    <div class="grid">
      <section class="panel video-panel">
        <div class="video-wrap" id="video-wrap">
          <img id="video-feed" src="/video_feed" alt="视频预览" draggable="false">
          <div class="overlay-layer" id="overlay-layer">
            <div class="overlay-box cpu-detected" id="cpu-detected-box"><span class="box-label">CPU DETECT</span></div>
            <div class="overlay-box qr-detected" id="qr-detected-box"><span class="box-label">QR DETECT</span></div>
          </div>
        </div>
        <div>
          <div class="section-head">
            <label>日志输出</label>
            <button class="alt small-btn" id="clear-log-btn">清空日志</button>
          </div>
          <div class="log-box" id="log-box"></div>
        </div>
      </section>
      <section class="panel controls">
        <div class="row">
          <select id="device-select"></select>
          <button class="alt" id="refresh-btn">刷新设备</button>
        </div>

        <div class="field-grid">
          <label for="work-order-input">工单号</label>
          <input id="work-order-input" placeholder="请输入工单号">

          <label for="sn-input">输入 SN 号</label>
          <input id="sn-input" placeholder="请输入 SN">

          <label for="vendor-input">前三码</label>
          <input id="vendor-input" placeholder="前三码" disabled>

          <label for="model-input">后四码</label>
          <input id="model-input" placeholder="后四码" disabled>
        </div>

        <label class="checkline">
          <input type="checkbox" id="vendor-enabled">
          编辑前三码 / 后四码
        </label>

        <label class="checkline">
          <input type="checkbox" id="loop-detect">
          循环检测
        </label>

        <div class="metrics">
          <div class="metric">
            <span class="name">登录耗时</span>
            <span class="value" id="download-cost">-</span>
          </div>
          <div class="metric">
            <span class="name">识别耗时</span>
            <span class="value" id="detect-cost">-</span>
          </div>
          <div class="metric">
            <span class="name">上传耗时</span>
            <span class="value" id="upload-cost">-</span>
          </div>
        </div>

        <div>
          <label>识别结果</label>
          <div class="result-box" id="result-box">等待检测</div>
        </div>

        <div class="row">
          <button id="detect-btn">开始检测</button>
        </div>
        <div class="footnote">SN 固定为手动输入。循环检测下，同一 SN 上次 PASS 会显示 PASS 等待下一台；同一 SN 上次 FAIL 会继续重试，直到 PASS 或换机。</div>
      </section>
    </div>
  </div>

  <script>
    const statusPill = document.getElementById("status-pill");
    const ocrTitleTrigger = document.getElementById("ocr-title-trigger");
    const localImageInput = document.getElementById("local-image-input");
    const deviceSelect = document.getElementById("device-select");
    const refreshBtn = document.getElementById("refresh-btn");
    const detectBtn = document.getElementById("detect-btn");
    const clearLogBtn = document.getElementById("clear-log-btn");
    const snInput = document.getElementById("sn-input");
    const vendorEnabled = document.getElementById("vendor-enabled");
    const vendorInput = document.getElementById("vendor-input");
    const modelInput = document.getElementById("model-input");
    const resultBox = document.getElementById("result-box");
    const logBox = document.getElementById("log-box");
    const videoWrap = document.getElementById("video-wrap");
    const videoFeed = document.getElementById("video-feed");
    const overlayLayer = document.getElementById("overlay-layer");
    const cpuDetectedBox = document.getElementById("cpu-detected-box");
    const qrDetectedBox = document.getElementById("qr-detected-box");
    const loopDetect = document.getElementById("loop-detect");
    const ROI_SOURCE_WIDTH = 640;
    const ROI_SOURCE_HEIGHT = 480;
    let currentState = {operation_mode: "server", local_image_name: null, overlays: {cpu: null, qr: null}};
    let loopTimer = null;
    let activeLoopSn = "";
    let lastAutoSubmittedSn = "";
    const LOOP_RETRY_DELAY_MS = 1200;
    const LOOP_WAIT_DELAY_MS = 1000;
    const overlaySampleCanvas = document.createElement("canvas");
    const overlaySampleContext = overlaySampleCanvas.getContext("2d", {willReadFrequently: true});

    function costText(value) {
      return value == null ? "-" : `${value.toFixed(3)}s`;
    }

    function updateDeviceOptions(devices, selectedDevice) {
      const previous = deviceSelect.value;
      deviceSelect.innerHTML = "";
      if (!devices.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "无可用设备";
        deviceSelect.appendChild(option);
        deviceSelect.disabled = true;
        return;
      }

      deviceSelect.disabled = false;
      devices.forEach((device) => {
        const option = document.createElement("option");
        option.value = device;
        option.textContent = device;
        deviceSelect.appendChild(option);
      });
      deviceSelect.value = selectedDevice || previous || devices[0];
    }

    function syncVendorEditState() {
      const editable = vendorEnabled.checked;
      vendorInput.disabled = !editable;
      modelInput.disabled = !editable;
    }

    function focusSnInput() {
      window.requestAnimationFrame(() => {
        snInput.focus();
        snInput.select();
      });
    }

    function sanitizeFixedLengthInput(value, maxLength) {
      return (value || "")
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .slice(0, maxLength);
    }

    function sanitizeSnInput(value) {
      return (value || "")
        .replace(/\D/g, "")
        .slice(0, 12);
    }

    function maybeLockVendorInputs() {
      const vendorValue = sanitizeFixedLengthInput(vendorInput.value, 3);
      const modelValue = sanitizeFixedLengthInput(modelInput.value, 4);
      if (vendorInput.value !== vendorValue) {
        vendorInput.value = vendorValue;
      }
      if (modelInput.value !== modelValue) {
        modelInput.value = modelValue;
      }
      const vendorComplete = vendorValue.length === 3;
      const modelComplete = modelValue.length === 4;
      if (vendorComplete && modelComplete) {
        vendorEnabled.checked = false;
      }
      syncVendorEditState();
    }

    function clearSnInputForNextDevice() {
      snInput.value = "";
      lastAutoSubmittedSn = "";
      focusSnInput();
    }

    function resolveSubmittedSn() {
      const manualValue = snInput.value.trim();
      if (manualValue) {
        activeLoopSn = manualValue;
        return manualValue;
      }
      return activeLoopSn;
    }

    function applyResultState(text) {
      const normalized = (text || "").trim().toUpperCase();
      resultBox.classList.remove("pass", "fail", "pending");
      if (normalized.startsWith("PASS")) {
        resultBox.classList.add("pass");
      } else if (normalized.startsWith("FAIL")) {
        resultBox.classList.add("fail");
      } else {
        resultBox.classList.add("pending");
      }
    }

    function scaleRect(rect, width, height) {
      return {
        left: (rect.x / ROI_SOURCE_WIDTH) * width,
        top: (rect.y / ROI_SOURCE_HEIGHT) * height,
        width: (rect.w / ROI_SOURCE_WIDTH) * width,
        height: (rect.h / ROI_SOURCE_HEIGHT) * height
      };
    }

    function intersects(a, b) {
      return !(a.left + a.width < b.left || b.left + b.width < a.left || a.top + a.height < b.top || b.top + b.height < a.top);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function resetOverlayBox(boxEl) {
      boxEl.style.display = "none";
      boxEl.style.left = "";
      boxEl.style.top = "";
      boxEl.style.width = "";
      boxEl.style.height = "";
    }

    function renderOverlayBox(boxEl, overlay, width, height) {
      if (!overlay || !overlay.rect) {
        resetOverlayBox(boxEl);
        return null;
      }
      const rect = scaleRect(overlay.rect, width, height);
      boxEl.style.display = "block";
      boxEl.style.left = `${rect.left}px`;
      boxEl.style.top = `${rect.top}px`;
      boxEl.style.width = `${rect.width}px`;
      boxEl.style.height = `${rect.height}px`;
      return rect;
    }

    function renderDetectionOverlay() {
      const width = videoWrap.clientWidth;
      const height = videoWrap.clientHeight;
      if (!width || !height) {
        return;
      }
      resetOverlayBox(cpuDetectedBox);
      resetOverlayBox(qrDetectedBox);
      const cpuOverlay = currentState.overlays?.cpu;
      const qrOverlay = currentState.overlays?.qr;
      const qrRect = renderOverlayBox(qrDetectedBox, qrOverlay, width, height);
      const cpuRect = renderOverlayBox(cpuDetectedBox, cpuOverlay, width, height);
    }

    function renderState(data) {
      const overlays = Object.prototype.hasOwnProperty.call(data || {}, "overlays")
        ? (data.overlays || {cpu: null, qr: null})
        : {cpu: null, qr: null};
      currentState = {
        ...currentState,
        ...data,
        overlays
      };
      const shouldStickToBottom =
        logBox.scrollHeight - logBox.clientHeight - logBox.scrollTop < 24;
      if (data.detecting) {
        statusPill.textContent = "检测进行中";
      } else if (data.operation_mode === "local") {
        statusPill.textContent = `本地图片模式${data.local_image_name ? `: ${data.local_image_name}` : ""}`;
      } else {
        statusPill.textContent = "服务运行中";
      }
      detectBtn.disabled = data.detecting;
      refreshBtn.disabled = data.detecting;
      resultBox.textContent = data.result_text || "等待检测";
      applyResultState(resultBox.textContent);
      document.getElementById("download-cost").textContent = costText(data.time_info.download);
      document.getElementById("detect-cost").textContent = costText(data.time_info.detect);
      document.getElementById("upload-cost").textContent = costText(data.time_info.upload);
      updateDeviceOptions(data.devices, data.selected_device);
      syncVendorEditState();
      renderDetectionOverlay();
      logBox.textContent = data.logs.join("\n");
      if (shouldStickToBottom) {
        logBox.scrollTop = logBox.scrollHeight;
      }
    }

    async function fetchStatus() {
      const response = await fetch("/api/status");
      const data = await response.json();
      renderState(data);
    }

    async function refreshDevices() {
      const response = await fetch("/api/devices");
      const data = await response.json();
      updateDeviceOptions(data.devices, data.selected_device);
      await fetchStatus();
    }

    async function changeDevice() {
      await fetch("/api/select-device", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({device: deviceSelect.value})
      });
      await fetchStatus();
    }

    function clearLoopTimer() {
      if (loopTimer) {
        clearTimeout(loopTimer);
        loopTimer = null;
      }
    }

    function scheduleLoopDetect(delay = LOOP_RETRY_DELAY_MS) {
      clearLoopTimer();
      if (!loopDetect.checked) {
        return;
      }
      loopTimer = setTimeout(() => {
        detect(true);
      }, delay);
    }

    function validateDetectInputs() {
      const workOrderNumber = document.getElementById("work-order-input").value.trim();
      const sn = resolveSubmittedSn();
      const vendor = sanitizeFixedLengthInput(vendorInput.value, 3);
      const model = sanitizeFixedLengthInput(modelInput.value, 4);
      const missing = [];
      if (!workOrderNumber) {
        missing.push("工单号");
      }
      if (!sn) {
        missing.push("SN");
      }
      if (!vendor) {
        missing.push("前三码");
      }
      if (!model) {
        missing.push("后四码");
      }
      if (!missing.length) {
        if (sn.length !== 12) {
          return "SN必须为12位。";
        }
        if (!/^\d{12}$/.test(sn)) {
          return "SN必须全为数字。";
        }
        if (!sn.startsWith("156")) {
          return "SN客户代码必须为156。";
        }
        const week = Number(sn.slice(5, 7));
        if (week < 0 || week > 53) {
          return "SN中的周数必须在00-53之间。";
        }
        if (vendor.length !== 3) {
          return "前三码必须为 3 位。";
        }
        if (model.length !== 4) {
          return "后四码必须为 4 位。";
        }
        return null;
      }
      return `${missing.join("、")}不能为空。`;
    }

    async function syncClientResult(resultText, status, errorText = "") {
      try {
        const response = await fetch("/api/client-result", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            result_text: resultText,
            status,
            error: errorText
          })
        });
        const data = await response.json();
        if (response.ok) {
          currentState = {
            ...currentState,
            ...(data.state || {})
          };
        }
      } catch (error) {
      }
    }

    async function detect(fromLoop = false) {
      const validationError = validateDetectInputs();
      if (validationError) {
        const failText = `FAIL\n${validationError}`;
        resultBox.textContent = failText;
        statusPill.textContent = validationError;
        applyResultState(resultBox.textContent);
        clearLoopTimer();
        await syncClientResult(failText, "fail", validationError);
        return;
      }
      clearLoopTimer();
      detectBtn.disabled = true;
      statusPill.textContent = loopDetect.checked ? "循环检测中" : "检测进行中";
      const submittedSn = resolveSubmittedSn();
      if (!fromLoop) {
        lastAutoSubmittedSn = submittedSn;
      }
      clearSnInputForNextDevice();
      try {
        const response = await fetch("/api/detect", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            work_order_number: document.getElementById("work-order-input").value,
            sn: submittedSn,
            vendor: vendorInput.value,
            model: modelInput.value
          })
        });
        const data = await response.json();
        if (!response.ok && response.status !== 409) {
          resultBox.textContent = "FAIL";
        }
        const resultStatus = data.state?.last_result_status;
        if (resultStatus === "pass") {
          activeLoopSn = "";
          clearSnInputForNextDevice();
          statusPill.textContent = "PASS，等待下一台设备";
        }
        renderState(data.state || data);
        if (!response.ok && data.error) {
          statusPill.textContent = data.error;
        }
        if (loopDetect.checked) {
          const isBusyConflict = response.status === 409 && (data.error || "").includes("检测进行中");
          const shouldContinue = isBusyConflict;
          if (shouldContinue) {
            scheduleLoopDetect(LOOP_RETRY_DELAY_MS);
          }
        }
      } catch (error) {
        resultBox.textContent = "FAIL";
        statusPill.textContent = "检测请求失败";
      } finally {
        detectBtn.disabled = false;
        focusSnInput();
      }
    }

    function maybeAutoDetectFromSn() {
      if (!loopDetect.checked) {
        return;
      }
      if (currentState.detecting) {
        return;
      }
      const sn = resolveSubmittedSn();
      if (sn.length !== 12) {
        return;
      }
      if (sn === lastAutoSubmittedSn) {
        return;
      }
      detect(true);
    }

    async function clearLocalImageMode() {
      statusPill.textContent = "切回摄像头中";
      const response = await fetch("/api/local-mode", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: "exit"})
      });
      const data = await response.json();
      renderState(data.state || data);
    }

    async function enterLocalImageMode() {
      statusPill.textContent = "进入本地图片模式";
      const response = await fetch("/api/local-mode", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: "enter"})
      });
      const data = await response.json();
      renderState(data.state || data);
    }

    async function uploadLocalImage(file) {
      const formData = new FormData();
      formData.append("image", file);
      statusPill.textContent = "上传本地图片中";
      const response = await fetch("/api/local-image", {
        method: "POST",
        body: formData
      });
      const data = await response.json();
      renderState(data.state || data);
    }

    async function clearLogs() {
      clearLogBtn.disabled = true;
      const response = await fetch("/api/logs/clear", {method: "POST"});
      const data = await response.json();
      renderState(data.state || data);
      clearLogBtn.disabled = false;
    }

    vendorEnabled.addEventListener("change", syncVendorEditState);
    vendorInput.addEventListener("input", maybeLockVendorInputs);
    modelInput.addEventListener("input", maybeLockVendorInputs);
    snInput.addEventListener("input", () => {
      const sanitized = sanitizeSnInput(snInput.value);
      if (snInput.value !== sanitized) {
        snInput.value = sanitized;
      }
      const nextValue = sanitized.trim();
      if (nextValue) {
        activeLoopSn = nextValue;
      } else {
        activeLoopSn = "";
        lastAutoSubmittedSn = "";
      }
      maybeAutoDetectFromSn();
    });
    refreshBtn.addEventListener("click", refreshDevices);
    detectBtn.addEventListener("click", () => detect(false));
    loopDetect.addEventListener("change", () => {
      if (loopDetect.checked) {
        statusPill.textContent = "循环检测已开启，等待12位SN";
        maybeAutoDetectFromSn();
      } else {
        clearLoopTimer();
        activeLoopSn = "";
        lastAutoSubmittedSn = "";
        statusPill.textContent = "循环检测已关闭";
      }
    });
    clearLogBtn.addEventListener("click", clearLogs);
    deviceSelect.addEventListener("change", changeDevice);
    window.addEventListener("resize", renderDetectionOverlay);
    videoFeed.addEventListener("load", renderDetectionOverlay);
    ocrTitleTrigger.addEventListener("dblclick", async () => {
      if (currentState.operation_mode === "server") {
        await enterLocalImageMode();
        return;
      }
      if (currentState.local_image_name) {
        await clearLocalImageMode();
        return;
      }
      localImageInput.click();
    });
    localImageInput.addEventListener("change", async () => {
      const file = localImageInput.files && localImageInput.files[0];
      if (!file) {
        return;
      }
      await uploadLocalImage(file);
      localImageInput.value = "";
    });

    maybeLockVendorInputs();
    syncVendorEditState();
    applyResultState(resultBox.textContent);
    refreshDevices();
    fetchStatus();
    setInterval(fetchStatus, 1500);
  </script>
</body>
</html>
